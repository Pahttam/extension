<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Export coordonnées → CAO</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 13px; padding: 10px; color: #222; }
  h3 { margin: 0 0 8px 0; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12px; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: right; }
  #status { margin-top: 10px; white-space: pre-wrap; padding: 6px; background: #f4f4f4; border-radius: 4px; }
  label { display: block; margin-bottom: 8px; }
  input[type=number] { width: 70px; }
</style>
</head>
<body>
  <h3>Export des points → CAO</h3>

  <button id="btnFetch">1. Récupérer les points de la maquette</button><br/>
  <button id="btnSend" disabled>2. Exporter en .txt (ID_Point X Y Z)</button>
  <button id="btnCopy" disabled>3. Copier les points (presse-papiers)</button><br/>
  <button id="btnClearTrimble" disabled>Vider les points sélectionnés dans Trimble Connect</button>

  <div id="status">Connexion à Trimble Connect...</div>

  <table id="preview">
    <thead><tr><th>#</th><th>X (mm)</th><th>Y (mm)</th><th>Z (mm)</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
// -----------------------------------------------------------------------
// Extension Trimble Connect 3D Viewer
// Utilise la Trimble Connect Workspace API (officielle) :
// https://components.connect.trimble.com/trimble-connect-workspace-api/index.html
//
// IMPORTANT (documenté officiellement) :
// MarkupPick.positionX / positionY / positionZ sont TOUJOURS exprimées
// en millimètres, quel que soit l'affichage choisi dans le projet Trimble Connect.
// Réf. : https://components.connect.trimble.com/trimble-connect-workspace-api/interfaces/MarkupPick.html
// -> La conversion mm -> m est donc systématique (division par 1000),
//    aucune détection heuristique de l'unité n'est nécessaire ici.
//
// À PROPOS DU BOUTON "2. Exporter en .txt" :
// Génération et téléchargement du fichier ENTIÈREMENT côté navigateur
// (Blob + lien <a download>), sans aucun appel réseau. Ce choix évite
// délibérément l'écueil rencontré avec une première version qui envoyait les
// points à une application locale via localhost : cette approche-là se
// heurtait à la restriction "Local Network Access" de Chrome/Edge (bloquée
// sauf si la page hôte, ici Trimble Connect, ajoute l'attribut
// allow="local-network-access" sur l'iframe — hors de notre contrôle).
// Réf. : https://developer.chrome.com/blog/local-network-access
// Le téléchargement de fichier ne passe par aucun de ces mécanismes réseau :
// c'est une fonctionnalité native et ancienne du navigateur. Seul point non
// garanti à 100 % sans test : un attribut sandbox restrictif sans
// allow-downloads sur l'iframe de l'extension bloquerait le téléchargement —
// peu probable ici (l'extension communique déjà librement avec
// window.parent), mais "3. Copier les points" reste le filet de sécurité si
// jamais ce cas se présentait.
//
// BOUTON "Vider les points sélectionnés dans Trimble Connect" :
// Supprime de la maquette uniquement les points récupérés à l'étape 1 (via
// leurs id individuels). Ne jamais appeler API.markup.removeMarkups(undefined) :
// cela supprimerait TOUS les marqueurs de la maquette (lignes, nuages, mesures
// d'angle...), pas seulement les points uniques.
// -----------------------------------------------------------------------

let API = null;
let currentPoints = []; // [{id, x_mm, y_mm, z_mm}]

const statusEl = document.getElementById('status');
const btnFetch = document.getElementById('btnFetch');
const btnSend = document.getElementById('btnSend');
const btnCopy = document.getElementById('btnCopy');
const btnClearTrimble = document.getElementById('btnClearTrimble');
const previewBody = document.querySelector('#preview tbody');

function setStatus(msg) {
  statusEl.textContent = msg;
}

async function init() {
  try {
    API = await TrimbleConnectWorkspace.connect(window.parent, (event, data) => {
      // Les événements du viewer pourraient être journalisés ici si besoin.
    });
    setStatus("Connecté à Trimble Connect.\nPlace tes points avec l'outil \"Point unique\", puis clique sur 1.");
  } catch (e) {
    setStatus("Erreur de connexion à Trimble Connect : " + e.message);
  }
}

btnFetch.onclick = async () => {
  if (!API) { setStatus("API non connectée."); return; }
  try {
    const markups = await API.markup.getSinglePointMarkups();
    currentPoints = markups.map(m => ({
      id: m.id,
      x_mm: m.start.positionX,
      y_mm: m.start.positionY,
      z_mm: m.start.positionZ,
    }));
    renderPreview();
    if (currentPoints.length === 0) {
      setStatus("Aucun point trouvé.\nUtilise l'outil \"Point unique\" dans le viewer, puis réessaie.");
      btnSend.disabled = true;
      btnCopy.disabled = true;
      btnClearTrimble.disabled = true;
    } else {
      setStatus(currentPoints.length + " point(s) trouvé(s). Utilise \"2. Exporter\" ou \"3. Copier les points\".");
      btnSend.disabled = false;
      btnCopy.disabled = false;
      btnClearTrimble.disabled = false;
    }
  } catch (e) {
    setStatus("Erreur lors de la lecture des points : " + e.message);
  }
};

function renderPreview() {
  previewBody.innerHTML = '';
  currentPoints.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td>${p.x_mm.toFixed(1)}</td><td>${p.y_mm.toFixed(1)}</td><td>${p.z_mm.toFixed(1)}</td>`;
    previewBody.appendChild(tr);
  });
}

function formatLinesInMeters() {
  // Conversion mm -> m déterministe (voir commentaire en tête de fichier).
  return currentPoints.map((p, i) => {
    const x = (p.x_mm / 1000).toFixed(3);
    const y = (p.y_mm / 1000).toFixed(3);
    const z = (p.z_mm / 1000).toFixed(3);
    return `P${i + 1} ${x} ${y} ${z}`;
  }).join('\n');
}

function downloadTextFile(filename, content) {
  // Génère et télécharge un fichier texte entièrement côté navigateur,
  // sans aucun appel réseau (voir commentaire en tête de fichier).
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

btnSend.onclick = () => {
  if (currentPoints.length === 0) {
    setStatus("Aucun point à exporter (clique d'abord sur \"1. Récupérer les points\").");
    return;
  }
  const content = formatLinesInMeters() + '\n';
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const filename = `points_trimble_${stamp}.txt`;
  try {
    downloadTextFile(filename, content);
    setStatus(currentPoints.length + " point(s) exporté(s) dans \"" + filename + "\" " +
      "(dossier Téléchargements du navigateur).");
  } catch (e) {
    setStatus("Échec de l'export (" + e.message + "). Utilise \"3. Copier les points\" en secours.");
  }
};

btnCopy.onclick = async () => {
  // Filet de sécurité sur Chrome/Edge : copie déjà convertie en mètres.
  const lines = formatLinesInMeters();
  try {
    await navigator.clipboard.writeText(lines);
    setStatus("Texte copié dans le presse-papiers (" + currentPoints.length + " point(s), déjà en mètres).\n" +
      "Colle-le dans l'application Python (bouton \"Coller depuis le presse-papiers\").");
  } catch (e) {
    setStatus("Copie automatique impossible (" + e.message + ").\n" +
      "Utilise \"2. Exporter en .txt\" à la place, qui ne dépend d'aucune permission du navigateur.");
  }
};

btnClearTrimble.onclick = async () => {
  if (!API) { setStatus("API non connectée."); return; }
  if (currentPoints.length === 0) {
    setStatus("Aucun point à supprimer (clique d'abord sur \"1. Récupérer les points\").");
    return;
  }
  // On ne supprime QUE les points récupérés à l'étape 1, via leurs identifiants
  // individuels. On n'appelle jamais removeMarkups(undefined), qui supprimerait
  // TOUS les marqueurs de la maquette (lignes, nuages, mesures d'angle...), pas
  // seulement les points uniques.
  const ids = currentPoints.map(p => p.id).filter(id => id !== undefined && id !== null);
  try {
    await API.markup.removeMarkups(ids);
    const missing = currentPoints.length - ids.length;
    currentPoints = [];
    renderPreview();
    btnSend.disabled = true;
    btnCopy.disabled = true;
    btnClearTrimble.disabled = true;
    let msg = ids.length + " point(s) supprimé(s) de la maquette. Prêt pour un nouveau relevé.";
    if (missing > 0) {
      msg += "\n" + missing + " point(s) sans identifiant n'ont pas pu être supprimés automatiquement " +
        "(à retirer manuellement dans le viewer si besoin).";
    }
    setStatus(msg);
  } catch (e) {
    setStatus("Erreur lors de la suppression des points : " + e.message);
  }
};

init();
</script>
</body>
</html>
