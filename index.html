<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Export coordonnées → CAO</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; font-size: 13px; padding: 10px; color: #222; }
  h3 { margin: 0 0 8px 0; }
  button { margin: 4px 4px 4px 0; padding: 6px 10px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 12px; }
  td, th { border: 1px solid #ccc; padding: 2px 6px; text-align: right; }
  #status { margin-top: 10px; white-space: pre-wrap; padding: 6px; background: #f4f4f4; border-radius: 4px; }
  label { display: block; margin-bottom: 8px; }
  input[type=number] { width: 70px; }
</style>
</head>
<body>
  <h3>Export des points → CAO</h3>

  <button id="btnFetch">1. Récupérer les points de la maquette</button><br/>
  <button id="btnSend" disabled>2. Exporter en .txt (ID_Point X Y Z)</button>
  <button id="btnCopy" disabled>3. Copier les points (presse-papiers)</button><br/>
  <button id="btnImport">Importer un fichier de points (.txt) sur la maquette</button>
  <input type="file" id="fileInput" accept=".txt,.csv" style="display:none" />
  <br/>
  <button id="btnClearTrimble" disabled>Vider les points sélectionnés dans Trimble Connect</button>

  <hr/>
  <p><strong>Extraction automatique depuis l'IFC</strong> — aucune sélection manuelle nécessaire,
    ces boutons interrogent directement toute la maquette :</p>
  <button id="btnListColumns">Lister toutes les colonnes</button>
  <button id="btnListBeams">Lister toutes les poutres</button>
  <textarea id="testOutput" readonly rows="14" style="width:100%; font-family:monospace; box-sizing:border-box; margin-top:6px;"
    placeholder="Le résultat JSON brut apparaîtra ici."></textarea>

  <div id="status">Connexion à Trimble Connect...</div>

  <table id="preview">
    <thead><tr><th>#</th><th>X (mm)</th><th>Y (mm)</th><th>Z (mm)</th></tr></thead>
    <tbody></tbody>
  </table>

<script>
// -----------------------------------------------------------------------
// Extension Trimble Connect 3D Viewer
// Utilise la Trimble Connect Workspace API (officielle) :
// https://components.connect.trimble.com/trimble-connect-workspace-api/index.html
//
// IMPORTANT (documenté officiellement) :
// MarkupPick.positionX / positionY / positionZ sont TOUJOURS exprimées
// en millimètres, quel que soit l'affichage choisi dans le projet Trimble Connect.
// Réf. : https://components.connect.trimble.com/trimble-connect-workspace-api/interfaces/MarkupPick.html
// -> La conversion mm -> m est donc systématique (division par 1000),
//    aucune détection heuristique de l'unité n'est nécessaire ici.
//
// À PROPOS DU BOUTON "2. Exporter en .txt" :
// Génération et téléchargement du fichier ENTIÈREMENT côté navigateur
// (Blob + lien <a download>), sans aucun appel réseau. Ce choix évite
// délibérément l'écueil rencontré avec une première version qui envoyait les
// points à une application locale via localhost : cette approche-là se
// heurtait à la restriction "Local Network Access" de Chrome/Edge (bloquée
// sauf si la page hôte, ici Trimble Connect, ajoute l'attribut
// allow="local-network-access" sur l'iframe — hors de notre contrôle).
// Réf. : https://developer.chrome.com/blog/local-network-access
// Le téléchargement de fichier ne passe par aucun de ces mécanismes réseau :
// c'est une fonctionnalité native et ancienne du navigateur. Seul point non
// garanti à 100 % sans test : un attribut sandbox restrictif sans
// allow-downloads sur l'iframe de l'extension bloquerait le téléchargement —
// peu probable ici (l'extension communique déjà librement avec
// window.parent), mais "3. Copier les points" reste le filet de sécurité si
// jamais ce cas se présentait.
//
// BOUTON "Importer un fichier de points (.txt) sur la maquette" :
// Lecture du fichier ENTIÈREMENT côté navigateur (input file natif), même
// principe de fiabilité que l'export : aucun serveur, aucun réseau. Format
// attendu : une ligne par point "Nom X Y Z" (espaces, coordonnées en mètres,
// identique au format d'export). Conversion m -> mm à l'envoi (API en mm,
// voir plus haut).
// Réf. addSinglePointMarkups : https://components.connect.trimble.com/trimble-connect-workspace-api/interfaces/MarkupAPI.html#addSinglePointMarkups
// Réf. champs MarkupPick (positionX/Y/Z obligatoires, modelId/objectId
// optionnels donc un point "libre" est possible) :
// https://components.connect.trimble.com/trimble-connect-workspace-api/interfaces/MarkupPick.html
// LIMITE CONNUE : PointMarkup n'expose pas de champ "nom" — le nom (colonne 1
// du fichier) sert uniquement à l'identification côté fichier source ; une
// fois posé, le point n'affiche que ses coordonnées dans Trimble Connect,
// comme un point cliqué manuellement.
// PAS ENCORE FAIT : couleur distincte pour les points importés — le format
// exact attendu par ColorRGBA (échelle 0-1 ou 0-255) n'a pas été confirmé
// avec une source fiable ; à vérifier ensemble avant de l'ajouter plutôt que
// de deviner sur un appel qui pourrait échouer.
//
// BOUTON "Vider les points sélectionnés dans Trimble Connect" :
// Supprime de la maquette uniquement les points récupérés à l'étape 1 (via
// leurs id individuels). Ne jamais appeler API.markup.removeMarkups(undefined) :
// cela supprimerait TOUS les marqueurs de la maquette (lignes, nuages, mesures
// d'angle...), pas seulement les points uniques.
// -----------------------------------------------------------------------

let API = null;
let currentPoints = []; // [{id, x_mm, y_mm, z_mm}]

const statusEl = document.getElementById('status');
const btnFetch = document.getElementById('btnFetch');
const btnSend = document.getElementById('btnSend');
const btnCopy = document.getElementById('btnCopy');
const btnImport = document.getElementById('btnImport');
const fileInput = document.getElementById('fileInput');
const btnClearTrimble = document.getElementById('btnClearTrimble');
const previewBody = document.querySelector('#preview tbody');

function setStatus(msg) {
  statusEl.textContent = msg;
}

async function init() {
  try {
    API = await TrimbleConnectWorkspace.connect(window.parent, (event, data) => {
      // Les événements du viewer pourraient être journalisés ici si besoin.
    });
    setStatus("Connecté à Trimble Connect.\nPlace tes points avec l'outil \"Point unique\", puis clique sur 1.");
  } catch (e) {
    setStatus("Erreur de connexion à Trimble Connect : " + e.message);
  }
}

btnFetch.onclick = async () => {
  if (!API) { setStatus("API non connectée."); return; }
  try {
    const markups = await API.markup.getSinglePointMarkups();
    currentPoints = markups.map(m => ({
      id: m.id,
      x_mm: m.start.positionX,
      y_mm: m.start.positionY,
      z_mm: m.start.positionZ,
    }));
    renderPreview();
    if (currentPoints.length === 0) {
      setStatus("Aucun point trouvé.\nUtilise l'outil \"Point unique\" dans le viewer, puis réessaie.");
      btnSend.disabled = true;
      btnCopy.disabled = true;
      btnClearTrimble.disabled = true;
    } else {
      setStatus(currentPoints.length + " point(s) trouvé(s). Utilise \"2. Exporter\" ou \"3. Copier les points\".");
      btnSend.disabled = false;
      btnCopy.disabled = false;
      btnClearTrimble.disabled = false;
    }
  } catch (e) {
    setStatus("Erreur lors de la lecture des points : " + e.message);
  }
};

function renderPreview() {
  previewBody.innerHTML = '';
  currentPoints.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i + 1}</td><td>${p.x_mm.toFixed(1)}</td><td>${p.y_mm.toFixed(1)}</td><td>${p.z_mm.toFixed(1)}</td>`;
    previewBody.appendChild(tr);
  });
}

function formatLinesInMeters() {
  // Conversion mm -> m déterministe (voir commentaire en tête de fichier).
  return currentPoints.map((p, i) => {
    const x = (p.x_mm / 1000).toFixed(3);
    const y = (p.y_mm / 1000).toFixed(3);
    const z = (p.z_mm / 1000).toFixed(3);
    return `P${i + 1} ${x} ${y} ${z}`;
  }).join('\n');
}

function downloadTextFile(filename, content) {
  // Génère et télécharge un fichier texte entièrement côté navigateur,
  // sans aucun appel réseau (voir commentaire en tête de fichier).
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

btnSend.onclick = () => {
  if (currentPoints.length === 0) {
    setStatus("Aucun point à exporter (clique d'abord sur \"1. Récupérer les points\").");
    return;
  }
  const content = formatLinesInMeters() + '\n';
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const filename = `points_trimble_${stamp}.txt`;
  try {
    downloadTextFile(filename, content);
    setStatus(currentPoints.length + " point(s) exporté(s) dans \"" + filename + "\" " +
      "(dossier Téléchargements du navigateur).");
  } catch (e) {
    setStatus("Échec de l'export (" + e.message + "). Utilise \"3. Copier les points\" en secours.");
  }
};

btnCopy.onclick = async () => {
  // Filet de sécurité sur Chrome/Edge : copie déjà convertie en mètres.
  const lines = formatLinesInMeters();
  try {
    await navigator.clipboard.writeText(lines);
    setStatus("Texte copié dans le presse-papiers (" + currentPoints.length + " point(s), déjà en mètres).\n" +
      "Colle-le dans l'application Python (bouton \"Coller depuis le presse-papiers\").");
  } catch (e) {
    setStatus("Copie automatique impossible (" + e.message + ").\n" +
      "Utilise \"2. Exporter en .txt\" à la place, qui ne dépend d'aucune permission du navigateur.");
  }
};

function parsePointsFile(text) {
  // Format attendu, identique à l'export : "Nom X Y Z" (espaces, mètres).
  const markups = [];
  let skipped = 0;
  text.split(/\r?\n/).forEach(line => {
    const trimmed = line.trim();
    if (!trimmed) return; // ligne vide : ignorée silencieusement
    const parts = trimmed.split(/\s+/);
    if (parts.length !== 4) { skipped++; return; }
    const [, xs, ys, zs] = parts; // le nom (parts[0]) n'est pas exploitable côté Trimble Connect (voir limite en tête de fichier)
    const x = parseFloat(xs), y = parseFloat(ys), z = parseFloat(zs);
    if ([x, y, z].some(v => Number.isNaN(v))) { skipped++; return; }
    markups.push({
      start: {
        // Conversion m -> mm : l'API attend des millimètres (voir commentaire en tête de fichier).
        positionX: x * 1000,
        positionY: y * 1000,
        positionZ: z * 1000,
      }
    });
  });
  return { markups, skipped };
}

btnImport.onclick = () => fileInput.click();

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  fileInput.value = ''; // permet de resélectionner le même fichier plus tard
  if (!file) return;
  if (!API) { setStatus("API non connectée."); return; }

  let text;
  try {
    text = await file.text();
  } catch (e) {
    setStatus("Impossible de lire le fichier (" + e.message + ").");
    return;
  }

  const { markups, skipped } = parsePointsFile(text);
  if (markups.length === 0) {
    setStatus("Aucune ligne valide trouvée (format attendu : \"Nom X Y Z\", en mètres).");
    return;
  }

  try {
    const added = await API.markup.addSinglePointMarkups(markups);
    let msg = added.length + " point(s) importé(s) et posé(s) sur la maquette.";
    if (skipped > 0) {
      msg += "\n" + skipped + " ligne(s) ignorée(s) (format invalide).";
    }
    setStatus(msg);
  } catch (e) {
    setStatus("Erreur lors de l'ajout des points sur la maquette : " + e.message);
  }
};

btnClearTrimble.onclick = async () => {
  if (!API) { setStatus("API non connectée."); return; }
  if (currentPoints.length === 0) {
    setStatus("Aucun point à supprimer (clique d'abord sur \"1. Récupérer les points\").");
    return;
  }
  // On ne supprime QUE les points récupérés à l'étape 1, via leurs identifiants
  // individuels. On n'appelle jamais removeMarkups(undefined), qui supprimerait
  // TOUS les marqueurs de la maquette (lignes, nuages, mesures d'angle...), pas
  // seulement les points uniques.
  const ids = currentPoints.map(p => p.id).filter(id => id !== undefined && id !== null);
  try {
    await API.markup.removeMarkups(ids);
    const missing = currentPoints.length - ids.length;
    currentPoints = [];
    renderPreview();
    btnSend.disabled = true;
    btnCopy.disabled = true;
    btnClearTrimble.disabled = true;
    let msg = ids.length + " point(s) supprimé(s) de la maquette. Prêt pour un nouveau relevé.";
    if (missing > 0) {
      msg += "\n" + missing + " point(s) sans identifiant n'ont pas pu être supprimés automatiquement " +
        "(à retirer manuellement dans le viewer si besoin).";
    }
    setStatus(msg);
  } catch (e) {
    setStatus("Erreur lors de la suppression des points : " + e.message);
  }
};

function stringifySafe(obj) {
  // JSON.stringify plante nativement sur un BigInt ("Do not know how to
  // serialize a BigInt") : on le convertit en chaîne lisible pour le
  // diagnostic, sans changer les autres types de valeurs.
  return JSON.stringify(obj, (key, value) => (typeof value === 'bigint' ? value.toString() + 'n' : value), 2);
}

async function listElementsByClass(ifcClass) {
  // Réf. champ "class" du filtre : https://components.connect.trimble.com/trimble-connect-workspace-api/interfaces/EntityParameter.html
  // Valeur "IFCCOLUMN" observée empiriquement sur un poteau réel (Tekla exporte
  // en majuscules, contrairement à la casse "IfcColumn" de la doc générique).
  // "IFCBEAM" pour les poutres est une extrapolation par analogie, PAS encore
  // vérifiée empiriquement : si le bouton "Lister toutes les poutres" renvoie
  // 0 résultat alors que la maquette en contient, c'est le premier point à
  // remettre en cause.
  //
  // IMPORTANT (constaté empiriquement) : getObjects() avec un filtre ne renvoie
  // que les identifiants des objets (léger, pensé pour de gros volumes), PAS
  // leur position ni leurs propriétés (elles reviennent "undefined"). Il faut
  // enchaîner avec getObjectProperties(modelId, ids) sur ces mêmes id pour
  // obtenir le détail complet.
  //
  // convertToObjectIds(modelId, ids) donne le GUID IFC réel (obligatoire par la
  // norme), plus fiable que le champ Tekla "Initial GUID" vu vide sur un test
  // précédent. Attention : documenté comme levant une exception si NE SERAIT-CE
  // QU'UN SEUL id du lot n'a pas de GUID correspondant — dans ce cas, on n'a
  // aucun GUID pour tout le lot, pas seulement pour l'élément fautif.
  const outputBox = document.getElementById('testOutput');
  if (!API) { setStatus("API non connectée."); return; }
  try {
    const result = await API.viewer.getObjects({ parameter: { class: ifcClass } });
    let output = `=== getObjects({ parameter: { class: '${ifcClass}' } }) ===\n`;
    let total = 0;

    for (const modelEntry of (result || [])) {
      const ids = (modelEntry.objects || []).map(o => o.id);
      total += ids.length;
      output += `\nModèle "${modelEntry.modelId}" : ${ids.length} élément(s) trouvé(s) (id seul à ce stade)\n`;
      if (ids.length === 0) continue;

      const details = await API.viewer.getObjectProperties(modelEntry.modelId, ids);

      let guids = null;
      let guidError = null;
      try {
        guids = await API.viewer.convertToObjectIds(modelEntry.modelId, ids);
      } catch (e) {
        guidError = e.message;
      }

      output += `\n=== getObjectProperties("${modelEntry.modelId}") + convertToObjectIds sur ces ${ids.length} élément(s) ===\n`;
      details.slice(0, 5).forEach(o => {
        const flatProps = (o.properties || []).flatMap(ps => ps.properties || []);
        const ref = flatProps.find(p => p.name === 'Reference');
        const guid = guids ? guids[ids.indexOf(o.id)] : '(indisponible pour ce lot)';
        output += `  - id ${o.id} | position ${stringifySafe(o.position)} | Reference=${ref ? ref.value : '(absent)'} | GUID=${guid}\n`;
      });
      if (details.length > 5) output += `  ... (${details.length - 5} de plus, non affichées ici)\n`;
      if (guidError) {
        output += `  ATTENTION : convertToObjectIds a échoué pour ce lot (${guidError}) — au moins un ` +
          `élément du lot n'a pas de GUID externe ; aucun GUID n'a donc pu être obtenu pour ce lot entier.\n`;
      }
    }

    output += `\nTOTAL : ${total} élément(s) de classe "${ifcClass}".`;
    outputBox.value = output;
    setStatus(total + ` élément(s) "${ifcClass}" trouvé(s).`);
  } catch (e) {
    outputBox.value = "ERREUR : " + e.message;
    setStatus("Erreur pendant le test : " + e.message);
  }
}

document.getElementById('btnListColumns').onclick = () => listElementsByClass('IFCCOLUMN');
document.getElementById('btnListBeams').onclick = () => listElementsByClass('IFCBEAM');

init();
</script>
</body>
</html>
